name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # delete stale run artifacts before re-upload (see "Purge" step)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      # Re-running the *failed job* of a Pages deploy re-uploads a second
      # artifact named "github-pages" into the same run; deploy-pages then
      # aborts with "Multiple artifacts named github-pages". Purge any left by
      # a prior attempt so a re-run always sees exactly one. No-op on the first
      # attempt (nothing to delete). A fresh run is still the cleaner recovery.
      - name: Purge stale github-pages artifacts from earlier attempts
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              echo "Deleting stale artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
