name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
      # Guard runs before `npm ci` so a poisoned lockfile (new install script,
      # banned family, planted config) is caught *before* any lifecycle script
      # can execute. The script is zero-dependency by design.
      - run: npm run guard
      - run: npm ci
      # Single verification entrypoint, shared with local sessions by
      # construction (no hand-maintained lockstep): the STATE-length guard, then
      # the post-install supply-chain guard (node_modules binding.gyp sweep),
      # typecheck, lint, unit tests, and build.
      - run: bash scripts/ladder.sh

  e2e:
    name: Playwright smoke
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
      # Pre-install guard here too: this job runs `npm ci` itself, so it gets
      # the same before-any-lifecycle-script gate as the check job.
      - run: npm run guard
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # Trusted Types is enforced only in the production build (the dev server
      # strips the directive), so this suite builds the app and runs against
      # `vite preview` to exercise the real shipped CSP.
      - run: npm run test:e2e:prod
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
