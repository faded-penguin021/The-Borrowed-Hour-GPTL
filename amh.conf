# amh.conf — the Agentic Maintenance Harness's settings for THIS repository.
#
# The shipped scripts under scripts/ are parameter-free and read this file at runtime.
# Change values HERE; never edit a shipped script locally, or upgrading becomes a merge.
#
# Sourced by bash. Keep it to simple KEY=value assignments.

# The harness version this repository has adopted. Record it — process drift is
# diagnosable only if the version that shaped the process is written down.
AMH_VERSION=14.0.0

# --- Git topology -----------------------------------------------------------
DEFAULT_BRANCH=main
BRANCH_PREFIX=claude
# branch-per-change | branch-train
MERGE_MODE=branch-per-change

# Environment flag marking a remote/ephemeral container. The session bootstrap runs
# toolchain setup only when this is 1 — never a heuristic that could surprise someone
# on their own machine.
REMOTE_FLAG=AMH_REMOTE

# --- Release window (session-start banner) ----------------------------------
# Optional, and both must be set for the line to appear. If your repository keeps its
# release version in a file and tags releases from it, name the file and the tag prefix
# here — e.g. VERSION and 'v' for a tag v1.4.0 — and every session's banner says whether
# that tag exists in the clone yet. The window between merging a version bump and cutting
# the tag is one where release docs naming the tag are false and no check can see it: the
# banner reports, it does not enforce. Leave empty if you do not tag releases.
VERSION_FILE=
RELEASE_TAG_PREFIX=

# --- Runtime inventory (session-start banner) -------------------------------
# Both optional and independent; an empty value switches its line off entirely.
# REQUIRED_TOOLS is a space-separated list of commands the ladder needs on PATH. Each is
# probed with `type -P` and reported `observed` or `unavailable` — a real probe, so a real
# answer about this environment. Only the name is printed, never the resolved path. (`type -P`
# and not `command -v`: the latter resolves builtins, functions and aliases before it looks at
# PATH, so it reports `printf` as observed on a machine holding no binaries at all.)
# ADAPTER_FILES is a space-separated list of the agent-adapter files this repository ships.
# Each is reported `configured` when present and `unknown` when absent — NEVER `observed`
# and never `unavailable`. Present means this repo REQUESTS an integration; nothing can see
# a hook actually fire. Absent means this repo declares none, which is not evidence that
# none exists — an adapter configured at user level is invisible from inside the tree.
# Neither list can express a name containing a space. NOTHING CONSUMES THE REPORTED STATES:
# they are printed for a human and discarded, and no guard or gate may ever branch on them. (A
# guard may read the ADAPTER_FILES *list* to check it has not drifted from the adapters you
# ship — that reads paths you wrote, never a state this banner derived.)
#
# `node` and `npm` carry every rung of scripts/verify.sh; `git` carries the guards. `jq` is
# NOT listed: nothing in this repo's ladder uses it, and a list padded with tools we do not
# need turns `unavailable` into noise. Playwright's browser is deliberately absent too — it
# is an env var (`PW_CHROMIUM`) pointing at a binary, not a command on PATH, and e2e is not
# a rung.
REQUIRED_TOOLS='git node npm'
# Claude Code is this repo's only adapter. `.claude/settings.json` holds the permission rails
# and both PreToolUse hook wirings; the SessionStart adapter is the one genuinely
# Claude-specific script. Neither line is evidence a hook fired — see above.
ADAPTER_FILES='.claude/settings.json .claude/hooks/session-start.sh'

# --- Working memory: the state file's size band (hysteresis) ----------------
# Threshold inventory (13.0.0 vocabulary): WARN is a compression TRIGGER; HARD is a
# REJECTION BOUNDARY; both COMPRESS_TO values are POST-ACTION CEILINGS; EDIT_DELTA is a
# trigger that classifies a shrink already made. Boundaries decide when machinery
# intervenes, never how much content an author should produce. Pick numbers so
# WARN − COMPRESS_TO spans many sessions of growth and HARD − WARN leaves one long
# session of margin; the band between trigger and ceiling IS the debounce, and it is
# stateless only because it is wide (D-005).
#
# A landing must satisfy BOTH post-action ceilings, because neither works alone. A byte
# ceiling is reachable by shaving words, which removes no content; a sentence ceiling is
# reachable by rewriting `. T` to `; t`, which frees no space. Each blocks the cheap move
# that satisfies the other, and folding whole stages is what satisfies both at once. WARN
# and HARD stay byte-only: they answer WHEN to compress, and nobody drafts toward them.
#
# Passing both counters establishes only that the result is not obviously oversized. It does
# NOT establish concision, correct scope, or information quality (12.0.0). Do not merge
# sentences, repunctuate, remove useful qualifiers, or otherwise rewrite solely to change a
# counter. Near a limit, reconsider durable lessons that belong in the ledger, debugging
# chronology, and completed state — do not optimize the measurement.
STATE_FILE=docs/STATE.md
STATE_COMPRESS_TO_KB=9
# Calibrated, not copied: this repo's state file measures ~167 bytes per sentence as the
# ladder's counter sees them, so 9 KB is ~55 sentences and a 50-sentence ceiling bites just
# ahead of the byte ceiling. Set them far apart and one of the two is decorative. Re-measure
# after a compression pass rather than trusting this figure; it is prose and nothing checks it.
STATE_COMPRESS_TO_SENTENCES=50
STATE_WARN_KB=14
STATE_HARD_KB=16
# Above WARN, a shrink smaller than this is an ordinary edit (a typo fix, a closed queue
# item) and is allowed with the warning still armed; a shrink this size or larger is a
# compression pass and must satisfy both post-action ceilings. Put it in the empty gap
# between the two populations — an edit that large and a compression that small should
# both be unlikely.
STATE_EDIT_DELTA_BYTES=1024

# Section headers that must survive compression ('|' separated); a missing one fails.
#
# `## Owner queue` and `## Decided non-items` are in the list on top of the shipped
# default, and both are carried over from this repo's pre-AMH ladder rather than added
# now. The queue is ALSO checked by the shipped structure guard, which only warns — that
# asymmetry is the harness's, and it is the right default for a repo whose queue may
# legitimately empty. Here it has never been empty and its disappearance has always been
# a hard failure, so the stronger rule stays. The non-items list is what stops a
# compression pass re-opening a decision the owner already closed.
STATE_REQUIRED_SECTIONS='## Project|## Current state|## Owner queue|## Decided non-items|## Changelog'
# The owner's channel: its disappearance is a warning, not a failure.
STATE_OWNER_QUEUE_SECTION='## Owner queue'

# --- Permanent memory: the append-only ledger -------------------------------
LEDGER_DIR=docs
LEDGER_BASENAME=LEDGER
# Rollover boundary: a row that would start after this line opens the next volume. The
# live volume's byte size is measurement only. The ledger's own header deliberately states
# NO number and names this key instead (5.1.0/13.0.0) — do not "restore" a digit there, which
# rebuilds the drift class those releases removed. Boundaries decide when machinery
# intervenes, never how much content an author should produce.
LEDGER_LINE_CAP=800

# The WORKING limit on a new row, and the one an author writes against (8.0.0). A rejection
# boundary, never a desired size: write the smallest self-contained durable lesson first, and
# one or two sentences are preferable when they suffice. Counting sentences is what makes the
# limit resistant to word-by-word shaving, which is the move a byte limit alone invites.
#
# Approaching it is a CLASSIFICATION signal, not an editing target (10.5.1): a row near the
# boundary probably holds narrative or two lessons, so split it, reduce it to the durable
# conclusion, or route the narrative to git and leave a concise pointer. Passing it
# establishes only that the row is not obviously oversized — never concision, scope or
# information quality (12.0.0).
LEDGER_ROW_SENTENCE_CAP=6

# The SECOND rejection boundary, in bytes under LC_ALL=C (ASCII/UTF-8 therefore counts one
# byte per ASCII character). It is a backstop beneath the sentence cap — it catches the
# pathologically dense sentence the counter cannot see — and not the number to write against.
# Not the same unit as LEDGER_LINE_CAP above, which counts lines in a whole volume.
#
# 800 -> 1400 on the 14.0.0 upgrade, and the reasoning is the owner's test, not the shipped
# default's (owner, 2026-09-06): a cap becomes the target over time, so the only defensible
# value is the SMALLEST one that does not re-create the defect the sentence cap was added to
# remove. Two constraints bracket it. It must exceed the longest sentence-compliant row, which
# measures 1029 bytes here: at 800 that row is rejected on BYTES while obeying the sentence
# cap, which puts authors back to shaving words — the exact Goodhart move 8.0.0 cut the
# sentence cap to stop, and the reason 800 cannot simply stay. And it must stay far enough
# below a paragraph of narrative that nobody drafts toward it. 1400 is ~233 bytes across the
# 6 permitted sentences against a house style of ~170, so it admits a legitimately dense row
# and nothing longer.
#
# The shipped default is 2000. It was NOT taken: asked whether 2000 would stay a ceiling
# rather than become a target, the honest answer was no, and an unsure yes is how a cap drifts
# upward once and never back. 2000 is also calibrated on the harness's own corpus, not this
# one. If rows start arriving at 1350, this number is failing and the fix is to look at what
# is in them, not to raise it.
#
# Setting it at all is not optional bookkeeping: unlike the two banner keys above, an absent
# LEDGER_ROW_CHAR_CAP does not switch its rung off — scripts/ladder.sh defaults it to 2000
# and enforces it either way. A cap that binds every future row belongs where this repo can
# see it, not only in a shipped script's variable block. That the 4.2.0 Upgrading notes named
# no such key is the general lesson: D-016.
#
# Precisely: only OMITTING the key falls through to the shipped default. An empty value or a
# literal 0 silently disables the rung instead (`${LEDGER_ROW_CHAR_CAP:-0}` then
# `[ "$cap" -gt 0 ] || return`), which is the one-character way to switch off a cap the
# ledger's preamble promises binds every new row. A non-numeric value fails loudly. Changing
# either cap is a rule change, not a tuning knob.
#
# Both caps reach NEW rows only: the rung exempts any row whose ID already exists at HEAD
# (`[ -f "$TMP/head-rows/$id" ] && continue`), so no committed row was rewritten to land this.
# Note also what they reach in time: the rung returns early unless the ledger has uncommitted
# changes, so it binds rows still uncommitted at ladder time and a commit-then-verify order
# escapes it.
LEDGER_ROW_CHAR_CAP=1400

# Where citations are scanned for: code and workflows only — NOT docs (prose mentions
# IDs without citing them), and not the guard fixtures (which carry synthetic IDs).
#
# `src` is in scope because this repo's application code cites ledger rows directly
# (`src/llm/providers.ts` carries one today), and `.claude` because the agent adapter's
# wiring does too. Docs stay out of THIS key, as shipped — but this repo has always
# required a `D-NNN` in prose to resolve as well, so that half lives on in
# scripts/guards/docs-citations.sh rather than being dropped.
# THIS FILE is in scope too. The size band above and the scan scope below used to live in
# the pre-AMH ladder script, where they carried their ledger citations and the guard could
# see them; moving them into config must not quietly demote a load-bearing citation to
# prose. Config that decides a guard's behaviour is code for this purpose.
CITATION_SCAN_PATHS='src scripts .github .claude amh.conf'
# Only the guard fixtures, which carry synthetic `D-NNN` IDs by design — they are the
# material the citation guard is tested against. The shipped scripts need no exclusion:
# they refer to the harness's own ledger rows in a form the guard does not read as a
# citation, so everything left in scope is something you wrote.
CITATION_EXCLUDE='scripts/test-ladder-guards.sh scripts/tests'

# --- Commit hygiene ---------------------------------------------------------
# Fixed strings that must never reach a commit message: a squash merge would fold them
# onto the default branch, and force-push is forbidden, so it is permanent until merge.
POISON_TOKENS='[skip ci]|[ci skip]|***NO_CI***'

# Optional, and LEAVING IT OUT IS A SUPPORTED STATE — the key is deliberately absent
# here. An extended regex every commit's author and committer address must match WHOLE,
# checked over origin/<default>..HEAD. Without it the author-identity rung still fails on
# the identities git invents for itself (root@host, @localhost, @host.local, a missing
# @), which need no list; with it you also state which addresses this project's commits
# carry. Set it if your repo has an answer to that — e.g. a forge no-reply alias:
#   AUTHOR_EMAIL_ALLOW='[^@]+@users\.noreply\.github\.com'
# Note what no regex can do: it cannot tell a personal address from a work one.

# --- Multi-session plans ----------------------------------------------------
PLAN_DIR=docs/plans

# --- Legislation: files whose diffs require the rule-review protocol ---------
#
# THIS FILE is in the list, and that is not decoration: it defines the thresholds, the
# poison tokens, the citation scope and this very list — so leaving it out lets an agent
# raise STATE_HARD_KB, blank POISON_TOKENS, or empty RULE_FILES itself, dismantling the
# tripwire with no warning. A scope list that does not cover the file defining the scope
# list is not a scope list.
#
# Your state file and ledger are deliberately ABSENT even though their preambles are
# legislation: they change in nearly every unit, the tripwire is file-granular and cannot
# fire on a section, and warn fatigue kills tripwires. Those sections are prose-only.
#
# LEAVE the entries for files you do not have. An entry naming a file that does not exist
# is inert — the tripwire matches paths in a diff, and a path that cannot appear never
# matches — and it starts working by itself the day a larger install profile adds the file.
# Pruning one buys nothing and silently narrows the scope: you would receive the runbook on
# a later re-run with the tripwire no longer covering it, and nothing would say so. Narrowing
# this list is a rule change either way, never housekeeping.
#
# Add each new agent adapter's config file here.
#
# `CLAUDE.md` leads the list because it, not `AGENTS.md`, is this repo's constitution —
# `AGENTS.md` is a pointer to it and must only point. `scripts/install-guard.sh` is the
# registry-install rail, which is repo-local here (the shipped command guard carries no
# such rail), and `scripts/guards` covers the repo-local guard directory: a guard's
# semantics are legislation for the same reason the ladder's are.
RULE_FILES='CLAUDE.md AGENTS.md docs/RUNBOOK.md amh.conf scripts/ladder.sh scripts/test-ladder-guards.sh scripts/command-guard.sh scripts/redact.sh scripts/session-start.sh scripts/install-guard.sh scripts/guards .claude/settings.json'
