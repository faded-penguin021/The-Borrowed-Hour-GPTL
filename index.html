<!doctype html>

<head>
  <meta charset="utf-8" />

  <title>The Borrowed Hour</title>
  <meta name="description" content="A literary interactive text adventure — a single borrowed hour, narrated turn by turn." />
  <!--
    script-src omits 'unsafe-inline' so a script-injection foothold can't run
    arbitrary inline JS — the app ships only external module scripts. The dev
    server re-adds 'unsafe-inline' via a Vite plugin (vite.config.js) because
    React Fast Refresh injects an inline preamble; production stays strict.
    https://js.puter.com is loaded lazily, and only when the (opt-in) Puter TTS
    provider is selected — a documented third-party trust surface.

    style-src is split so injected inline <style> elements (an XSS sink) are
    blocked while same-origin stylesheets and the Google Fonts @import in
    theme.css still load: granular-aware browsers (Chrome) honor style-src-elem
    (no 'unsafe-inline') for <style>/<link> and style-src-attr ('unsafe-inline')
    for the handful of React style={{}} usages; older browsers (Safari) ignore
    the granular directives and fall back to the permissive style-src, so
    nothing breaks. The dev server relaxes style-src-elem for HMR (vite.config.js).

    object-src/frame-ancestors are cheap hardening. upgrade-insecure-requests is
    deliberately omitted — it would rewrite the http://localhost:* /
    http://127.0.0.1:* local-LLM connect-src entries to https and break Ollama /
    LM Studio. connect-src lists the http(s) local origins only; the dev server
    also widens it with the ws:/wss: local origins Vite's HMR socket needs
    (vite.config.js), which the built policy omits.

    require-trusted-types-for 'script' is ENFORCED: the browser rejects a raw
    string assigned to a script-injection sink (innerHTML, eval/Function,
    HTMLScriptElement.src). Two such sinks exist: the lazy <script> that loads
    the opt-in Puter TTS SDK, and navigator.serviceWorker.register(). Each
    routes its one known-good URL through a Trusted Types policy
    (src/security/trustedTypes.ts) — `puter-loader` and `sw-loader` are the only
    names the trusted-types allowlist permits. A report endpoint is neither needed
    (enforcement does not depend on reporting) nor possible (this app has no
    backend, and adding a telemetry upload would violate the threat model — see
    THREAT_MODEL.md). The dev server strips this directive (vite.config.js)
    because Vite's HMR client and error overlay touch script sinks that exist
    only in tooling, never in the shipped build.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.puter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src https://api.openai.com https://generativelanguage.googleapis.com https://api.anthropic.com https://api.deepseek.com https://dashscope.aliyuncs.com https://api.moonshot.cn https://qianfan.baidubce.com https://api.mistral.ai https://api.groq.com https://openrouter.ai https://api.cerebras.ai https://api.elevenlabs.io https://texttospeech.googleapis.com https://*.tts.speech.microsoft.com https://*.puter.com https://image.pollinations.ai https://api.replicate.com https://replicate.delivery https://*.replicate.delivery https://oaidalleapiprodscus.blob.core.windows.net http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:*; img-src 'self' data: blob:; media-src 'self' blob: data: https://*.puter.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types puter-loader sw-loader" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0814" />

  <meta name="apple-mobile-web-app-title" content="Borrowed Hour" />
</head>
